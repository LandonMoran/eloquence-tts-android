# Gradle daemon + JVM
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# KSP/Kotlin
kotlin.code.style=official

# AGP: do not compress the packed language model (reads must stay mmap-able)
android.enableAppCompileTimeRClass=false

# Test-only override for x86_64 emulator lab.
#
# Mirrors the legacy build.sh TEST_MIN_API switch: the armeabi-v7a APK can be
# built at minSdk 25 so an API-25 arm32 emulator can install it (default 28).
# Pass -PtestMinApi=25 on the command line to exercise that lane.
testMinApi=28