name: Open a PR to main

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open pull request
        uses: repo-sync/pull-request@v2
        with:
          destination_branch: main
          pr_title: 'chore: Merge branch Dev to main'
          pr_body: |
            This pull request will merge `Dev` to `main`.

            ## Before merging this PR
            - [ ] Release checks pass (build, emulator smoke)
          pr_draft: true