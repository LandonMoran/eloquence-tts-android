name: oracle-assemble
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Comma-separated successful oracle-fanout run IDs for this revision
        required: true
        type: string
      dialect:
        required: true
        type: choice
        options: [zh-cn, zh-tw, ko, ja]
      pieces:
        description: Exact required pieces (1 through 8; Japanese uses 1 only)
        required: true
        default: '1,2,3,4,5,6,7,8'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch selected fanout runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail
          IFS=, read -ra ids <<< "$RUN_IDS"
          for id in "${ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid run ID"; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > /tmp/fanout-run.json
            python3 -c 'import json,os; r=json.load(open("/tmp/fanout-run.json")); assert r["path"] == ".github/workflows/oracle-fanout.yml" and r["conclusion"] == "success" and r["head_sha"] == os.environ["GITHUB_SHA"], "Run must be successful fanout at this revision"'
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'oracle-piece-*' --dir "pieces/$id"
          done
      - name: Assemble and validate every requested contribution
        env:
          DIALECT: ${{ inputs.dialect }}
          PIECES: ${{ inputs.pieces }}
        run: python3 tools/assemble_oracle.py pieces "$DIALECT" "$PIECES" "assembled/$DIALECT.tsv"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-tables-${{ inputs.dialect }}
          path: assembled/
          if-no-files-found: error
