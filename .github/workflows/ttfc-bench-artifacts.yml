# Build the arm64 app + androidTest APKs for the TTFC baseline benchmark
# (debug variants share the auto-generated debug signing key, which Firebase
# Test Lab requires for app+test installs), and upload both as artifacts.
#
# Mirrors the proven action set from build.yml / build-apk.yml: checkout@v4,
# setup-java@v5, inline sdkmanager (NO Docker-based actions — the runner set
# rejects them at startup). Arm64 only: Test Lab installs on real ARM64
# devices directly; no emulator needed.
name: ttfc-bench-artifacts

on:
  workflow_dispatch:
    inputs:
      minApi:
        description: 'Min SDK for the arm64 variant'
        required: false
        default: '28'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          [ -d "$SDK/ndk" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"

      - name: Build arm64 app + androidTest APKs (debug, same signing key)
        run: |
          ./gradlew --no-daemon --no-build-cache \
            :assembleArm64Debug \
            :assembleArm64DebugAndroidTest \
            -PtestMinApi=${{ inputs.minApi }}
          echo "=== app APK ==="
          find build/outputs/apk -name 'vvtts-arm64-v8a.apk' -exec ls -lh {} \;
          echo "=== androidTest APK ==="
          find build/outputs/apk/androidTest -name '*.apk' -exec ls -lh {} \;
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-arm64-app
          path: build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error

      - name: Upload androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-arm64-test
          path: build/outputs/apk/androidTest/arm64/debug/*.apk
          if-no-files-found: error