# Build the arm64 app APK + androidTest APK for the TTFC baseline benchmark,
# and upload both so they can be pushed to Firebase Test Lab.
name: ttfc-bench-artifacts

on:
  workflow_dispatch:
    inputs:
      minApi:
        description: 'Min SDK for the arm64 variant'
        required: false
        default: '28'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build app (arm64 debug) + androidTest APKs
        run: |
          # Cross-compile native .so for arm64, then assemble the androidTest
          # bundle + the app-under-test arm64 debug APK.
          ./gradlew --no-daemon --no-build-cache \
            :assembleArm64Debug \
            :assembleArm64DebugAndroidTest \
            -PtestMinApi=${{ inputs.minApi }}
        env:
          JAVA_TOOL_OPTIONS: "-Xmx3g"

      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-arm64-app
          path: build/outputs/apk/arm64/debug/*.apk

      - name: Upload androidTest APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-arm64-test
          path: build/outputs/apk/androidTest/arm64/debug/*.apk