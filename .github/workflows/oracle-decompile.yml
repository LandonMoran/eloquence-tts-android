name: oracle-decompile

on:
  workflow_dispatch:
    inputs:
      url:
        description: XAPK zip URL (factory split-pack( to fetch
        required: false
        default: "https://files.catbox.moe/3g38bc.zip"
      target:
        description: Split APK to decompile (default base.apk = Java wiring((
        required: false
        default: base.apk
  push:
    branches: [feat/ngram-tables]

permissions:
  contents: read

jobs:
  jadx:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch oracle XAPK
        run: |
          set -o pipefail
          curl -sSL -o factory.zip "${{ inputs.url }}"
          unzip -oq factory.zip -d splits "*.apk"
          ls -lh splits

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decompile with jadx
        run: |
          set -o pipefail
          curl -sSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx -d out --show-bad-code --threads-count 4 "splits/${{ inputs.target }}"

      - name: Package sources
        run: |
          tar czf decompiled.tgz out
          du -sh out

      - name: Upload decompiled sources
        uses: actions/upload-artifact@v4
        with:
          name: factory-sources
          path: decompiled.tgz
          if-no-files-found: error