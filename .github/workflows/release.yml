name: Sign release APKs
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  sign:
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers and restrict this environment to protected v* tags.
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: vvtts-signed-apk
          path: unsigned
      - name: Audit release input ABIs
        run: python3 tools/audit_apk_abis.py unsigned/vvtts-*.apk
      - name: Sign with release identity
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_B64:?release keystore required}"
          : "${KS_PASS:?release keystore password required}"
          : "${KEY_PASS:?release key password required}"
          key="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$key"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$signer"
          mkdir signed
          for apk in unsigned/*.apk; do
            "$signer" sign --ks "$key" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "signed/$(basename "$apk")" "$apk"
            "$signer" verify "signed/$(basename "$apk")"
          done
      - name: Audit signed release ABIs
        run: python3 tools/audit_apk_abis.py signed/vvtts-*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-apks
          path: signed/*.apk
          if-no-files-found: error
