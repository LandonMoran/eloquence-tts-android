name: Build APK (x86_64)

on:
  workflow_dispatch:
  # Manual-fast-smoke lane: the main Build APK workflow already emits the
  # TEST-ONLY x86_64 APK on every push, so do NOT double-trigger on push.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/android-sdk"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools" /tmp/cmdtools
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          sdk() {
            for i in  1 2 3; do
              if "$SDK/cmdline-tools/latest/bin/sdkmanager" "$@"; then
                return 0
              fi
              echo "  sdkmanager $* failed (try $i); retrying in 15s..."
              sleep 15
            done
            return 1
          }
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          yes | sdk --licenses > /dev/null || true
          sdk "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Fetch Kotlin compiler jars
        run: |
          fetch_jar() {
            local out="$1" path="$2" base
            for base in "https://repo.maven.apache.org" "https://maven-central.storage-download.googleapis.com" "https://repo1.maven.org"; do
              if curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -o "$out" "$base$path"; then
                echo "fetched $path via $base"
                return 0
              fi
            done
            echo "ERROR: all mirrors failed for $path" >&2
            return 1
          }
          fetch_jar /tmp/kotlin-compiler-embeddable-1.9.25.jar /maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          fetch_jar /tmp/trove4j-1.0.20200330.jar /maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          fetch_jar /tmp/kotlin-stdlib-1.9.25.jar /maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25/kotlin-stdlib-1.9.25.jar
          fetch_jar /tmp/annotations-24.1.0.jar /maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar
          (cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/.github/scripts/kotlin-compiler-1.9.25.sha256")

      - name: Prepare ephemeral CI signing key
        run: |
          KS_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -keystore vvttts.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias vvttts -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI Build,O=Home,C=US"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE=vvttts.jks" >> "$GITHUB_ENV"
      - name: Build APK (x86_64) via Gradle
        run: |
          export ANDROID_SDK="$HOME/android-sdk" ANDROID_HOME="$HOME/android-sdk" ANDROID_SDK_ROOT="$HOME/android-sdk"
          # Gradle :buildNative cross-compiles the x86_64 bridge, then AGP assembles
          # the test-only x86_64 flavor; rename to the artifact the smoke expects.
          ./gradlew --no-daemon --no-build-cache :assembleX64Release \
            -PtestMinApi=28
          find build/outputs/apk -name 'vvtts-test-x86_64.apk' -exec cp -f {} ./vvtts_signed.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-apk
          path: vvtts_signed.apk
          if-no-files-found: warn