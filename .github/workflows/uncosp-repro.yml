name: uncosp repro

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/openevv
    steps:
      - uses: actions/checkout@v4
      - name: Build host engine (enus voice only)
        run: make LANGS="lang/enus" build/libevv.a
      - name: Link repro harness
        run: gcc -O1 -Iinclude -Isrc/delta -Isrc/port -o uncosp_test cli/uncosp_test.c ../../jni/eci_compat.c build/libevv.a -lm -lpthread
      - name: Run the known killer words
        run: |
          for w in uncosp you cosp vowel vowel-pipeline; do
            ./uncosp_test "$w"
          done
      - name: Eye of the lighthouse (word list may grow here)
        run: ./uncosp_test uncosp you cosp