name: Emulator Crash Test (test button path)

on:
  workflow_dispatch:
    inputs:
      run_input_stress:
        description: 'Also run the swipe-storm input stress in this emulator session'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: ['feat/**', 'fix/**']

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (incl. emulator + x86_64 image)
        run: |
          SDK="$HOME/android-sdk"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools" /tmp/cmdtools
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          sdk() {
            for i in  1 2 3; do
              if "$SDK/cmdline-tools/latest/bin/sdkmanager" "$@"; then
                return 0
              fi
              echo "  sdkmanager $* failed (try $i); retrying in 15s..."
              sleep 15
            done
            return 1
          }
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sdk "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;26.3.11579264"
          sdk "emulator" "system-images;android-35;google_apis;x86_64"
          ls "$SDK/emulator/emulator" "$SDK/system-images/android-35/google_apis/x86_64"

      - name: Fetch Kotlin compiler jars
        run: |
          fetch_jar() {
            local out="$1" path="$2" base
            for base in "https://repo.maven.apache.org" "https://maven-central.storage-download.googleapis.com" "https://repo1.maven.org"; do
              if curl --retry 3 --retry-delay 2 --retry-all-errors -fsSL -o "$out" "$base$path"; then
                echo "fetched $path via $base"
                return 0
              fi
            done
            echo "ERROR: all mirrors failed for $path" >&2
            return 1
          }
          fetch_jar /tmp/kotlin-compiler-embeddable-1.9.25.jar /maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          fetch_jar /tmp/trove4j-1.0.20200330.jar /maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          fetch_jar /tmp/kotlin-stdlib-1.9.25.jar /maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25/kotlin-stdlib-1.9.25.jar
          fetch_jar /tmp/annotations-24.1.0.jar /maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar

      - name: Restore keystore from secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "::error::KEYSTORE_B64 secret not set — add it in the repo settings to enable signing"
            exit 1
          fi
          if [ -z "${{ secrets.KS_PASS }}" ]; then
            echo "::error::KS_PASS secret not set — add it in the repo settings to enable signing"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > vvttts.jks
          ls -la vvttts.jks

      - name: Build native bridge (x86_64)
        run: |
          export ANDROID_SDK="$HOME/android-sdk" ABI="x86_64"
          bash build_native.sh

      - name: Build APK (x86_64)
        run: |
          export ANDROID_SDK="$HOME/android-sdk"
          bash build.sh
        env:
          KEYSTORE: vvttts.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KS_PASS }}
          KOTLINC_CP: /tmp/kotlin-compiler-embeddable-1.9.25.jar:/tmp/trove4j-1.0.20200330.jar:/tmp/kotlin-stdlib-1.9.25.jar:/tmp/annotations-24.1.0.jar
          ABI: x86_64

      - name: Boot emulator + run crash test ( test button path)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 1800
          script: |
            bash "${GITHUB_WORKSPACE}/.github/scripts/crash_test.sh"
            if [ "${{ inputs.run_input_stress }}" = "true" ]; then
              bash "${GITHUB_WORKSPACE}/.github/scripts/input_stress.sh"
            fi

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: |
            logcat-full.txt
            stress-logcat.txt
          if-no-files-found: warn
