name: Emulator Crash Test (test button path)

on:
  workflow_dispatch:
  push:
    branches: ['feat/**', 'fix/**']

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (incl. emulator + x86_64 image)
        run: |
          SDK=/usr/local/lib/android/sdk
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"
          ls "$SDK/emulator/emulator" "$SDK/system-images/android-34/google_apis/x86_64"

      - name: Fetch Kotlin compiler jars
        run: |
          curl -fsSL -o /tmp/kotlin-compiler-embeddable-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          curl -fsSL -o /tmp/trove4j-1.0.20200330.jar https://repo1.maven.org/maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          curl -fsSL -o /tmp/kotlin-stdlib-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25.jar
          curl -fsSL -o /tmp/annotations-24.1.0.jar https://repo1.maven.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore vvtts.jks -storepass android123 -keypass android123 \
            -alias vvtts -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build,O=Home,C=US"

      - name: Build native bridge (x86_64 for emulator)
        run: bash build_native.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          ABI: x86_64

      - name: Build APK (x86_64)
        run: bash build.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          KEYSTORE: vvtts.jks
          KS_PASS: android123
          KEY_PASS: android123
          KOTLINC_CP: /tmp/kotlin-compiler-embeddable-1.9.25.jar:/tmp/trove4j-1.0.20200330.jar:/tmp/kotlin-stdlib-1.9.25.jar:/tmp/annotations-24.1.0.jar
          ABI: x86_64

      - name: Boot emulator
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "no" | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd \
            -n test -k "system-images;android-34;google_apis;x86_64" --device "pixel_2" --force
          "$SDK/emulator/emulator" -avd test -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect -no-boot-anim &
          "$SDK/platform-tools/adb" wait-for-device
          for i in $(seq 1 120); do
            BOOT="$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$BOOT" = "1" ] && break
            sleep 2
          done
          "$SDK/platform-tools/adb" shell input keyevent 82
          echo "BOOT_DONE"

      - name: Install and trigger test button path (autotest hook)
        run: |
          SDK=/usr/local/lib/android/sdk
          "$SDK/platform-tools/adb" install -r vvttts_signed.apk
          "$SDK/platform-tools/adb" logcat -c
          "$SDK/platform-tools/adb" shell am start -n com.xw.vvttts/.ui.SettingsActivity --es autotest chinese
          sleep 40
          "$SDK/platform-tools/adb" shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
          "$SDK/platform-tools/adb" logcat -d -v threadtime > logcat-full.txt || trueao
          echo "=== FATAL / CRASH LINES ==="
          grep -nE "FATAL EXCEPTION|SIGSEGV|SIGABRT|Fatal signal|Abort message|backtrace:|Process com.xw.vvtts" logcat-full.txt | head -40 || echo "NO_CRASH_MARKERS"
          echo "=== TAIL ==="
          tail -25 logcat-full.txt

      - name: Upload logcat
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat-full.txt
          if-no-files-found: warn