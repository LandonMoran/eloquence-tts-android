name: arm64-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: oracle-dev
          fetch-depth: 1

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Fetch aarch64 engine + build dump harness
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o aee.tar.gz "https://github.com/Mudb0y/Apple-Eloquence-ELF/releases/download/1.2.3/apple-eloquence-elf-1.2.3-linux-aarch64.tar.gz"
          tar -xzf aee.tar.gz
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          sed -i 's|/usr/lib/eloquence|'"$PWD"'/lib|g' eci.ini
          cc -O0 -g -rdynamic -o /tmp/dump_engine "$GITHUB_WORKSPACE/oracle/dump_engine.c" -ldl

      - name: ARM64 sanity - English + zh-CN
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          uname -m
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          echo "--- ENGLISH CONTROL ---"
          printf 'Hello, world.\nThis is a test sentence.\n' > /tmp/en2.txt
          taskset -c 0 /tmp/dump_engine 0x10000 < /tmp/en2.txt | awk -F'\t' '/pcm/{c[$2]++; if ($2>0) nz++} END{printf "pcm: "; for (k in c) printf "%s=%d ",k,c[k]; printf "\nnonzero=%d\n", nz+0}'
          en_nz=$(taskset -c 0 /tmp/dump_engine 0x10000 < /tmp/en2.txt | awk -F'\t' '/pcm/{if ($2>0) nz++} END{print nz+0}')
          if [ "$en_nz" = "0" ]; then
            echo "note: eciNewEx lane produced no audio for English (see render gate below: the eciNew() recipe is the CI-proven path, eciNewEx is unproven on this port"
          fi
          echo "--- ZH-CN (UTF-8) ---"
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt"
          taskset -c 0 /tmp/dump_engine 0x60000 < "$s" | awk -F'\t' '
            /pcm/{c[$2]++; if ($2>0) nz++}
            /pinyins/{if (substr($3,1,80) ~ /[1-9]/) pnz++; else pz++}
            END{
              printf "pcm: "; for (k in c) printf "%s=%d ",k,c[k]; printf "\n";
              printf "pinyin nonzero=%d allzero=%d\n", pnz+0, pz+0
            }'
          echo "ARM64 PROBE DONE"
      - name: Render gate - eciNew() recipe (CI-proven
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          cc -O0 -o /tmp/probe2 "$GITHUB_WORKSPACE/oracle/probe2.c" -ldl
          mkdir -p work_en work_zh
          cp lib/eci.so lib/enu.so work_en/
          cp lib/eci.so lib/chs.so lib/chsrom.so work_zh/
          printf '[1.0]\nPath=./enu.so\nVersion=6.1\n' > work_en/eci.ini
          printf '[6.0]\nPath=./chs.so\nPath_Rom=./chsrom.so\nVersion=6.1\n' > work_zh/eci.ini
          printf 'Hello, world.\nThis is a test sentence.\n' > /tmp/en2.txt
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt"
          nz() { awk -F'\t' '/pcm/{if ($2>0) nz++} END{print nz+0}'; }
          en_new=$(taskset -c 0 /tmp/probe2 work_en new < /tmp/en2.txt | nz)
          echo "en  eciNew    pcm=$en_new"
          if [ "$en_new" = "0" ]; then
            echo "FATAL: eciNew() lane renders no audio for English"
            exit 1
          fi
          en_ex=$(taskset -c 0 /tmp/probe2 work_en newEx 0x10000 < /tmp/en2.txt | nz)
          echo "en  eciNewEx  pcm=$en_ex (informational"
          zh_new=$(taskset -c 0 /tmp/probe2 work_zh new < "$s" | nz)
          echo "zh  eciNew    pcm=$zh_new"
          if [ "$zh_new" = "0" ]; then
            echo "FATAL: eciNew() lane renders no audio for zh-CN"
            exit 1
          fi
          zh_ex=$(taskset -c 0 /tmp/probe2 work_zh newEx 0x60000 < "$s" | nz)
          echo "zh  eciNewEx  pcm=$zh_ex (informational"
          echo "ARM64 RENDER GATE GREEN: eciNew() produces PCM for enu + zh-CN"