name: lpta-trace

on:
  workflow_dispatch:
    inputs:
      dialect:
        type: choice
        options:
          - zh-cn
          - zh-tw
          - ko
          - ja
        required: true
      lines:
        type: string
        default: "400"
        description: "corpus lines to trace (validation slice; use 0 for full sweep)"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install gdb and runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev gdb

      - name: Fetch converted engine (oracle, dev-only)
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o aee.tar.gz "https://github.com/Mudb0y/Apple-Eloquence-ELF/releases/download/1.2.3/apple-eloquence-elf-1.2.3-linux-aarch64.tar.gz"
          tar -xzf aee.tar.gz
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          cc -O0 -g -rdynamic -o /tmp/dump_engine "$GITHUB_WORKSPACE/oracle/dump_engine.c" -ldl

      - name: Prep oracle workdirs (gate layout, minimal ini + per-dialect libs)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          mkdir -p work_en work_zh_cn work_zh_tw work_ko work_ja
          cp lib/eci.so lib/enu.so work_en/
          cp lib/eci.so lib/chs.so lib/chsrom.so work_zh_cn/
          cp lib/eci.so lib/cht.so lib/chtrom.so work_zh_tw/
          cp lib/eci.so lib/kor.so lib/korrom.so work_ko/
          cp lib/eci.so lib/jpn.so lib/jpnrom.so work_ja/
          printf '[1.0]\nPath=./enu.so\nVersion=6.1\n' > work_en/eci.ini
          printf '[6.0]\nPath=./chs.so\nPath_Rom=./chsrom.so\nVersion=6.1\n' > work_zh_cn/eci.ini
          printf '[6.1]\nPath=./cht.so\nPath_Rom=./chtrom.so\nVersion=6.1\n' > work_zh_tw/eci.ini
          printf '[10.0]\nPath=./kor.so\nPath_Rom=./korrom.so\nVersion=6.1\n' > work_ko/eci.ini
          printf '[8.0]\nPath=./jpn.so\nPath_Rom=./jpnrom.so\nVersion=6.1\n' > work_ja/eci.ini
          echo prep-ok

      - name: Build trace breakpoint set for dialect
        id: bps
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          case "${{ inputs.dialect }}" in
            zh-cn) LIB=chs.so; WORK=work_zh_cn; D=0x60000; ENC=GB18030; SWEEP=hanzi-sweep.txt ;;
            zh-tw) LIB=cht.so; WORK=work_zh_tw; D=0x60001; ENC=BIG5;    SWEEP=hanzi-sweep.txt ;;
            ko)    LIB=kor.so; WORK=work_ko;    D=0xA0000; ENC=;        SWEEP=kor-sweep.txt ;;
            ja)    LIB=jpn.so; WORK=work_ja;    D=0x80000; ENC=;        SWEEP=ja-sample.txt ;;
          esac
          echo "DIALECT=${{ inputs.dialect }}" >> "$GITHUB_ENV"
          echo "WORKDIR=$WORK" >> "$GITHUB_ENV"
          echo "ENCODING=$ENC" >> "$GITHUB_ENV"
          echo "SWEEPFILE=$SWEEP" >> "$GITHUB_ENV"
          echo "DIALECT_HEX=$D" >> "$GITHUB_ENV"
          APPLIES=$(readelf -Ws "$WORK/$LIB" | awk '$5=="GLOBAL" && $8 ~ /^apply_/ {print $8}' | sort -u)
          : > /tmp/bp_apply.gdb
          for s in $APPLIES; do
            printf 'break %s\ncommands\n  silent\n  printf "APL %s\\n"\n  continue\nend\n' "$s" "$s" >> /tmp/bp_apply.gdb
          done
          { cat "$GITHUB_WORKSPACE/oracle/trace.gdb"; cat /tmp/bp_apply.gdb; echo; printf 'run %s < /tmp/sweep\nset logging off\n' "$D"; } > /tmp/trace_full.gdb
          echo "bp_count=$(grep -c '^break ' /tmp/trace_full.gdb)"

      - name: Generate corpora
        run: python3 "$GITHUB_WORKSPACE/oracle/make_corpus.py"

      - name: Trace rule fire (gdb, dialect ${{ inputs.dialect }})
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WORKDIR="$PWD/$WORKDIR"
          export DUMP_ONESHOT=1
          export DUMP_WANT_PHONEME=1
          unset DUMP_NOSYNTH DUMP_TRACE DUMP_PINYIN DUMP_GENPHON
          if [ -n "$ENCODING" ]; then
            iconv -f UTF-8 -t "$ENCODING" -c "$GITHUB_WORKSPACE/oracle/corpus/$SWEEPFILE" > /tmp/sweep.all 2>/dev/null || true
          else
            cp "$GITHUB_WORKSPACE/oracle/corpus/$SWEEPFILE" /tmp/sweep.all
          fi
          if [ "${{ inputs.lines }}" = "0" ]; then
            cp /tmp/sweep.all /tmp/sweep
          else
            head -n "${{ inputs.lines }}" /tmp/sweep.all > /tmp/sweep
          fi
          sed -i "1i set solib-search-path $DUMP_WORKDIR" /tmp/trace_full.gdb
          gdb -batch -ex "file /tmp/dump_engine" -x /tmp/trace_full.gdb 2>/tmp/gdb.err || true
          echo "in_lines=$(wc -l < /tmp/sweep)"
          echo "fire_bp=$(grep -c '^breakpoint' /tmp/gdb.err || true)"
          echo "tst_rows=$(grep -c '^TST' /tmp/rulefire.log || true)"
          echo "ins_rows=$(grep -c '^INS2' /tmp/rulefire.log || true)"
          echo "apl_rows=$(grep -c '^APL' /tmp/rulefire.log || true)"
          ls -la /tmp/rulefire.log /tmp/gdb.err

      - name: Upload rule fire log
        uses: actions/upload-artifact@v4
        with:
          name: rulefire-${{ inputs.dialect }}-${{ inputs.lines }}l
          path: |
            /tmp/rulefire.log
            /tmp/gdb.err
          if-no-files-found: error