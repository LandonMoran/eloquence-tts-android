name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'oracle/**'
      - '.github/workflows/oracle-dump.yml'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship a preinstalled SDK at /usr/local/lib/android/sdk
      # with working cmdline-tools; install the packages build.sh needs.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;35.0.0"
          # NDK ships preinstalled on runner images; install only if somehow absent.
          [ -d "$SDK/ndk" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
          # build.sh expects d8 under cmdline-tools/latest/bin; it actually
          # lives in build-tools. Symlink so the upstream script runs unmodified.
          mkdir -p "$SDK/cmdline-tools/latest/bin"
          ln -sf "$SDK/build-tools/35.0.0/d8" "$SDK/cmdline-tools/latest/bin/d8"

      - name: Install Kotlin compiler 1.9.25 (embeddable jar, no unzip)
        run: |
          set -e
          curl -fsSL -o /tmp/kotlin-compiler-embeddable-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          curl -fsSL -o /tmp/trove4j-1.0.20200330.jar https://repo1.maven.org/maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          curl -fsSL -o /tmp/kotlin-stdlib-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25/kotlin-stdlib-1.9.25.jar
          # Needed by the embeddable compiler when emitting nullability annotations (external funs)
          curl -fsSL -o /tmp/annotations-24.1.0.jar https://repo1.maven.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar
          ls -la /tmp/kotlin-compiler-embeddable-1.9.25.jar /tmp/trove4j-1.0.20200330.jar /tmp/kotlin-stdlib-1.9.25.jar /tmp/annotations-24.1.0.jar

      # CI-only dev keystore: generated per build, never committed (gitignored).
      # Sideloads fine; not a release identity.
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore vvtts.jks -storepass android123 -keypass android123 \
            -alias vvtts -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build,O=Home,C=US"

      - name: Build native bridge (arm64-v8a + armeabi-v7a; openevv + JNI core)
        run: |
          ABI=arm64-v8a bash build_native.sh
          ABI=armeabi-v7a bash build_native.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk

      - name: Build APK
        run: bash build.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          KEYSTORE: vvtts.jks
          KS_PASS: android123
          KEY_PASS: android123
          KOTLINC_CP: /tmp/kotlin-compiler-embeddable-1.9.25.jar:/tmp/trove4j-1.0.20200330.jar:/tmp/kotlin-stdlib-1.9.25.jar:/tmp/annotations-24.1.0.jar

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-signed-apk
          path: vvtts_signed.apk
          if-no-files-found: error

  chs-smoke:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate chs oracle table C
        run: python3 oracle/fitter.py oracle/table native/openevv/lang/chs/oracle_chs.c

      - name: Build host openevv (enus + chs)
        run: make -j"$(getconf _NPROCESSORS_ONLN)" -C native/openevv CC=cc LANGS="lang/enus lang/chs" RULES=c CFLAGS=-fPIC build/libevv-enus-chs.a

      - name: Compile and run oracle smoke
        run: |
          cc -O2 -I native/openevv/include -I jni -o /tmp/chs_smoke \
            oracle/chs_smoke.c jni/chs_oracle_synth.c native/openevv/build/libevv-enus-chs.a -lm
          /tmp/chs_smoke