name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship a preinstalled SDK at /usr/local/lib/android/sdk
      # with working cmdline-tools; install the packages build.sh needs.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;35.0.0"
          # build.sh expects d8 under cmdline-tools/latest/bin; it actually
          # lives in build-tools. Symlink so the upstream script runs unmodified.
          mkdir -p "$SDK/cmdline-tools/latest/bin"
          ln -sf "$SDK/build-tools/35.0.0/d8" "$SDK/cmdline-tools/latest/bin/d8"

      - name: Install Kotlin compiler 1.9.25
        run: |
          set -e
          curl -fL -o /tmp/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.25/kotlin-compiler-1.9.25.zip
          unzip -o -q /tmp/kotlin-compiler.zip -d "$HOME"
          ls -la "$HOME/kotlinc/kotlinc/bin/kotlinc"
          test -x "$HOME/kotlinc/kotlinc/bin/kotlinc"

      # CI-only dev keystore: generated per build, never committed (gitignored).
      # Sideloads fine; not a release identity.
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore vvtts.jks -storepass android123 -keypass android123 \
            -alias vvtts -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build,O=Home,C=US"

      - name: Build APK
        run: bash build.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          KEYSTORE: vvtts.jks
          KS_PASS: android123
          KEY_PASS: android123
          KOTLINC: /home/runner/kotlinc/kotlinc/bin/kotlinc

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-signed-apk
          path: vvtts_signed.apk
          if-no-files-found: error