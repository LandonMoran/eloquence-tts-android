name: Build APK

on:
  push:
    branches: ['**']
    paths-ignore:
      - '.github/workflows/oracle-dump.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_min_api:
        description: >-
          TEST-ONLY override: build the armeabi-v7a APK at this minSdk instead of
          28 (use 25 so an API-25 arm32 emulator can install it). Ignored for the
          arm64/universal/x86_64 builds.
        required: false
        default: '28'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Test-only min-api override for the armeabi-v7a APK. Defaults to 28 in
      # normal CI (push/PR); workflow_dispatch may set 25 for the arm32 lab
      # emulator. Read by build.sh as ${MIN_API:-28} for D8 --min-api.
      TEST_MIN_API: ${{ inputs.test_min_api || '28' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship a preinstalled SDK at /usr/local/lib/android/sdk
      # with working cmdline-tools; install the packages build.sh needs.
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;35.0.0"
          # NDK ships preinstalled on runner images; install only if somehow absent.
          [ -d "$SDK/ndk" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
          # build.sh expects d8 under cmdline-tools/latest/bin; it actually
          # lives in build-tools. Symlink so the upstream script runs unmodified.

          mkdir -p "$SDK/cmdline-tools/latest/bin"
          ln -sf "$SDK/build-tools/35.0.0/d8" "$SDK/cmdline-tools/latest/bin/d8"

      - name: Install Kotlin compiler 1.9.25 (embeddable jar, no unzip)

        run: |
          set -e
          curl -fsSL -o /tmp/kotlin-compiler-embeddable-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          curl -fsSL -o /tmp/trove4j-1.0.20200330.jar https://repo1.maven.org/maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          curl -fsSL -o /tmp/kotlin-stdlib-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25/kotlin-stdlib-1.9.25.jar
          # Needed by the embeddable compiler when emitting nullability annotations (external funs)
          curl -fsSL -o /tmp/annotations-24.1.0.jar https://repo1.maven.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar
          ls -la /tmp/kotlin-compiler-embeddable-1.9.25.jar /tmp/trove4j-1.0.20200330.jar /tmp/kotlin-stdlib-1.9.25.jar /tmp/annotations-24.1.0.jar
          (cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/.github/scripts/kotlin-compiler-1.9.25.sha256")

      # CI-only dev keystore: generated per build, never committed (gitignored).
      # Sideloads fine; not a release identity.
# CI-only dev keystore: generated per build with a random password;
# never committed (gitignored). Sideloads fine; never a release identity.
      - name: Prepare signing keystore
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > vvttts.jks
            chmod 600 vvttts.jks
            echo "KS_PASS=${RELEASE_KS_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${RELEASE_KEY_PASS}" >> "$GITHUB_ENV"
          else
            KS_PASS="$(openssl rand -hex 16)"
            keytool -genkeypair -v               -keystore vvttts.jks -storepass "$KS_PASS" -keypass "$KS_PASS"               -alias vvttts -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=CI Build,O=Home,C=US"
            echo "KS_PASS=${KS_PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASS=${KS_PASS}" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE=vvttts.jks" >> "$GITHUB_ENV"
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          RELEASE_KS_PASS: ${{ secrets.KS_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.KEY_PASS }}
      - name: Build native bridge (arm64-v8a + armeabi-v7a + x86_64; openevv + JNI core)
        run: |
          ABI=arm64-v8a bash build_native.sh
          ABI=armeabi-v7a bash build_native.sh
          # TEST-ONLY: x86_64 .so for the emulator lab (x86_64 system image).
          ABI=x86_64 bash build_native.sh
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk

      - name: Build APKs (arm64 + arm32 + universal; x86_64 test-only)
        run: |
          rm -f vvtts-arm64-v8a.apk vvtts-armeabi-v7a.apk vvtts-universal.apk vvtts-test-x86_64.apk
          echo "=== Build arm64-v8a (phones) ==="
          ABI=arm64-v8a bash build.sh && cp vvtts_signed.apk vvtts-arm64-v8a.apk
          echo "=== Build armeabi-v7a (32-bit devices/emulators) ==="
          # TEST_MIN_API is a test-only override (default 28); MIN_API=25 lets an
          # API-25 arm32 emulator install this APK. When the override differs from
          # 28, patch minSdkVersion in the manifest so aapt packages it (the
          # documented API-25 emulator lane otherwise fails with
          # INSTALL_FAILED_OLDER_SDK); restore the tracked manifest afterwards.
          MIN_API="${TEST_MIN_API:-28}"
          if [ "$MIN_API" != "28" ]; then
            sed -i "s/android:minSdkVersion=\"28\"/android:minSdkVersion=\"$MIN_API\"/" AndroidManifest.xml
          fi
          ABI=armeabi-v7a MIN_API="$MIN_API" bash build.sh && cp vvtts_signed.apk vvtts-armeabi-v7a.apk
          if [ "$MIN_API" != "28" ]; then
            git checkout -- AndroidManifest.xml
          fi
          echo "=== Build universal (both ABIs) ==="
          ABI=universal bash build.sh && cp vvtts_signed.apk vvtts-universal.apk
          echo "=== Build x86_64 (TEST-ONLY: emulator lab smoke; not a shipping artifact) ==="
          ABI=x86_64 bash build.sh && cp vvtts_signed.apk vvtts-test-x86_64.apk
          ls -lh vvtts-*.apk
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          KEYSTORE: vvtts.jks
          KS_PASS: ${{ env.KS_PASS }}
          KEY_PASS: ${{ env.KEY_PASS }}
          KOTLINC_CP: /tmp/kotlin-compiler-embeddable-1.9.25.jar:/tmp/trove4j-1.0.20200330.jar:/tmp/kotlin-stdlib-1.9.25.jar:/tmp/annotations-24.1.0.jar

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-signed-apk
          path: |
            vvtts-arm64-v8a.apk
            vvtts-armeabi-v7a.apk
            vvtts-universal.apk
          if-no-files-found: error

      - name: Upload TEST-ONLY x86_64 APK (emulator lab)
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-test-x86_64-apk
          path: vvtts-test-x86_64.apk
          if-no-files-found: error

  chs-smoke:

    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate chs oracle table C
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 oracle/merge_build.py oracle/table native/openevv/lang/chs/oracle_chs.c /tmp/oracle_chs_merged.c
          python3 oracle/check_gbk_gate.py /tmp/oracle_chs_merged.c
          if cmp -s /tmp/oracle_chs_merged.c native/openevv/lang/chs/oracle_chs.c; then
            echo "oracle_chs.c: regenerated content matches committed source (no tracked rewrite)"
          else
            echo "oracle_chs.c: regenerated content differs -- updating tracked source (review diff before committing)" >&2
            cp /tmp/oracle_chs_merged.c native/openevv/lang/chs/oracle_chs.c
          fi

      - name: Build host openevv (enus + chs)
        run: make -j"$(getconf _NPROCESSORS_ONLN)" -C native/openevv CC=cc LANGS="lang/enus lang/chs" RULES=c CFLAGS=-fPIC build/libevv-enus-chs.a

      - name: Compile and run oracle smoke
        run: |
          cc -O2 -I native/openevv/include -I native/openevv/src -I jni \
            -o /tmp/chs_smoke \
            oracle/chs_smoke.c jni/chs_oracle_synth.c jni/eci_compat.c \
            native/openevv/build/libevv-enus-chs.a -lm -lpthread
          /tmp/chs_smoke