name: Build APK

on:
  workflow_call:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_min_api:
        description: >-
          TEST-ONLY override: build the armeabi-v7a APK at this minSdk instead of
          28 (use 25 so an API-25 arm32 emulator can install it). Ignored for the
          arm64/universal/x86_64 builds.
        required: false
        default: '28'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Test-only min-api override for the armeabi-v7a APK. Defaults to 28 in
      # normal CI (push/PR); workflow_dispatch may set 25 for the arm32 lab
      # emulator. Fed to Gradle as -PtestMinApi for the armv7 flavor's minSdk.
      TEST_MIN_API: ${{ inputs.test_min_api || '28' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner images ship a preinstalled SDK at /usr/local/lib/android/sdk
      # with working cmdline-tools; install the packages the Gradle build needs
      # (compile SDK matching targetSdk 36, build-tools, NDK for build_native.sh).
      - name: Install Android SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          # NDK ships preinstalled on runner images; install only if somehow absent.
          [ -d "$SDK/ndk" ] || "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"

      - name: Host regression and source contracts
        env:
          ANDROID_JAR: /usr/local/lib/android/sdk/platforms/android-36/android.jar
          KOTLINC_CP: /tmp/kotlin-compiler-embeddable-1.9.25.jar:/tmp/trove4j-1.0.20200330.jar:/tmp/kotlin-stdlib-1.9.25.jar:/tmp/annotations-24.1.0.jar
          KXML_JAR: /tmp/kxml2-2.3.0.jar
        run: |
          curl -fsSL -o /tmp/kotlin-compiler-embeddable-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/1.9.25/kotlin-compiler-embeddable-1.9.25.jar
          curl -fsSL -o /tmp/trove4j-1.0.20200330.jar https://repo1.maven.org/maven2/org/jetbrains/intellij/deps/trove4j/1.0.20200330/trove4j-1.0.20200330.jar
          curl -fsSL -o /tmp/kotlin-stdlib-1.9.25.jar https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.25/kotlin-stdlib-1.9.25.jar
          curl -fsSL -o /tmp/annotations-24.1.0.jar https://repo1.maven.org/maven2/org/jetbrains/annotations/24.1.0/annotations-24.1.0.jar
          curl -fsSL https://repo1.maven.org/maven2/net/sf/kxml/kxml2/2.3.0/kxml2-2.3.0.jar -o "$KXML_JAR"
          bash tests/host/run.sh
          bash tests/native/run.sh
          bash tests/vendor-openevv-test.sh
          python3 tests/contracts.py
          python3 tools/prepare_assets.py --verify
          # Exercises the real FCM sender (JWT signing + v1 send) against a local
          # server; the release path depends on it, so it must not go untested.
          pip install --quiet cryptography
          python3 .github/scripts/test_send_fcm.py

      # Ephemeral CI identity; release signing is isolated in release.yml.
      - name: Prepare ephemeral CI signing key
        run: |
          KS_PASS="$(openssl rand -hex 32)"
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -keystore vvttts.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias vvttts -keyalg RSA -keysize 2048 -validity 30 -dname "CN=CI Build,O=Home,C=US"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KEYSTORE=vvttts.jks" >> "$GITHUB_ENV"

      - name: Build APKs via Gradle (native + arm64/arm32/universal; x86_64 test-only)
        run: |
          set -euo pipefail
          rm -f vvtts-arm64-v8a.apk vvtts-armeabi-v7a.apk vvtts-universal.apk vvtts-test-x86_64.apk
          # Gradle's :buildNative task runs the 3 build_native.sh ABI builds
          # (NDK cross-compile of openevv + JNI bridge), then AGP assembles each.
          gradle_tasks=(
            :assembleArm64Release :assembleArmv7Release :assembleUnivRelease :assembleX64Release
          )
          # Upload symbols only for release tags, not branch/PR builds.
          # Each upload task depends on buildNative and shares that build with
          # the assembly tasks in this invocation.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            task_listing="$RUNNER_TEMP/gradle-tasks.txt"
            ./gradlew --no-daemon --no-build-cache --console=plain tasks --all > "$task_listing"
            for variant in Arm64Release Armv7Release UnivRelease; do
              matches=$(grep -E "^[[:space:]]+uploadCrashlyticsSymbolFiles?${variant}[[:space:]]" "$task_listing" || true)
              if [[ $(printf '%s\n' "$matches" | sed '/^$/d' | wc -l) -ne 1 ]]; then
                echo "Expected exactly one Crashlytics symbol uploader for $variant; found:" >&2
                printf '%s\n' "$matches" >&2
                exit 1
              fi
              task_name=$(printf '%s\n' "$matches" | awk '{print $1}')
              gradle_tasks+=(":$task_name")
            done
          fi
          ./gradlew --no-daemon --no-build-cache "${gradle_tasks[@]}" \
            -PtestMinApi="${TEST_MIN_API:-28}"
          # Gather the four APKs at the repo root with the exact legacy filenames
          # that audit_apk_abis.py + publish_release.py expect.
          find build/outputs/apk -name 'vvtts-arm64-v8a.apk' -exec cp -f {} ./ \;
          find build/outputs/apk -name 'vvtts-armeabi-v7a.apk' -exec cp -f {} ./ \;
          find build/outputs/apk -name 'vvtts-universal.apk' -exec cp -f {} ./ \;
          find build/outputs/apk -name 'vvtts-test-x86_64.apk' -exec cp -f {} ./ \;
          ls -lh vvtts-*.apk
        env:
          ANDROID_SDK: /usr/local/lib/android/sdk
          KEYSTORE: vvttts.jks
          KS_PASS: ${{ env.KS_PASS }}
          KEY_PASS: ${{ env.KEY_PASS }}

      - name: Audit native ABI contents
        run: python3 tools/audit_apk_abis.py

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-signed-apk
          path: |
            vvtts-arm64-v8a.apk
            vvtts-armeabi-v7a.apk
            vvtts-universal.apk
          if-no-files-found: error

      - name: Upload TEST-ONLY x86_64 APK (emulator lab)
        uses: actions/upload-artifact@v4
        with:
          name: vvtts-test-x86_64-apk
          path: vvtts-test-x86_64.apk
          if-no-files-found: error