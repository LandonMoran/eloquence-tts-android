name: dll-survey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install JDK 21 + tools
        run: sudo apt-get update && sudo apt-get install -y openjdk-21-jdk-headless unzip

      - name: Install Ghidra headless
        run: |
          URL=$(
            curl -s "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest" \
              | grep browser_download_url | grep '\.zip"' | head -1 | cut -d'"' -f4
          )
          echo "ghidra_url=$URL"
          curl -sL -o /tmp/ghidra.zip "$URL"
          sudo mkdir -p /opt/ghidra
          sudo unzip -q /tmp/ghidra.zip -d /opt/ghidra
          sudo chmod -R a+x /opt/ghidra

      - name: Survey all romanizer binaries
        run: |
          set -e
          mkdir -p /tmp/dllsurv /tmp/proj
          cd /opt/ghidra/ghidra_*
          for f in "$GITHUB_WORKSPACE"/oracle/ref-dlls/*; do
            b=$(basename "$f")
            echo "=== SURVEYING $b"
            # raw strings snapshot for offline vocab diffing
            strings -n 2 "$f" > "/tmp/dllsurv/$b.strings.txt" || true
            set -x
            ./support/analyzeHeadless /tmp/proj surv \
              -import "$f" \
              -scriptPath "$GITHUB_WORKSPACE/oracle/ghidra" \
              -scriptlog "/tmp/dllsurv/$b.log" \
              -postScript DllSurvey.py \
              -deleteProject 2>&1 | tail -80
            echo "analyzeHeadless rc=${PIPESTATUS[0]}"
            set +x
            ls -la /tmp/dllsurv
          done
          echo "--- final artifact sizes:"
          du -sb /tmp/dllsurv/*

      - name: Upload survey outputs
        uses: actions/upload-artifact@v4
        with:
          name: dll-survey
          path: /tmp/dllsurv
          if-no-files-found: error