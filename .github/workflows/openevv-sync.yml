name: openevv upstream sync
# Refreshes the vendored engine (native/openevv) from LandonMoran/openevv `main`
# and opens/updates a PR into this repo. fork main = upstream + our engine mods;
# the FORK keeps itself current with upstream on its own schedule
# (.github/workflows/sync-upstream.yml), so this job only has to mirror fork main
# into the app tree. Sources branch `main` so followed_by_er / chs fusions /
# es_delete_checked are preserved. No PAT required (github.token owns the app push).
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eloquence-android
        uses: actions/checkout@v4

      - name: Clone fork main (source of truth for our engine)
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/LandonMoran/openevv.git /tmp/oe
          cd /tmp/oe
          git checkout -q main
          echo "fork_main=$(git rev-parse --short main)"
          git config user.name "openevv-sync[bot]"
          git config user.email "actions@github.com"

      - name: Re-vendor native/openevv from fork main
        run: |
          set -euo pipefail
          bash tools/vendor-openevv.sh /tmp/oe
          git add -A native/openevv
          git status --short -- native/openevv | head -30

      - name: Open (or update) automated PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet -- native/openevv; then
            echo "fork main matches the committed engine snapshot; no PR."
            exit 0
          fi
          BR=openevv/auto-sync
          git config user.email "actions@github.com"
          git config user.name "openevv-sync[bot]"
          git checkout -q -B "$BR" origin/main
          git commit -q -m "chore(openevv): sync vendored engine from fork main\n\nRefresh native/openevv from LandonMoran/openevv main (upstream + our engine mods: followed_by_er, chs fusions, es_delete_checked). Sources branch main; see tools/vendor-openevv.sh and .openevv-pin." || true
          git push -f --quiet origin "$BR"
          EXISTING=$(gh pr list --head "$BR" --json number --jq '.[0].number' 2>/dev/null)
          if [ -z "$EXISTING" ]; then
            gh pr create --base main --head "$BR" --title "chore(openevv): sync vendored engine from fork main" --body "Automated refresh of the vendored openevv engine from LandonMoran/openevv main. Sources branch \`main\` (upstream + our engine mods); see tools/vendor-openevv.sh."
          else
            echo "PR #$EXISTING updated in place."
          fi