name: oracle-dump

on:
  workflow_dispatch:
  push:
    branches: [oracle-dev]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev gdb

      - name: Fetch converted engine (oracle, dev-only
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o aee.tar.gz "https://github.com/Mudb0y/Apple-Eloquence-ELF/releases/download/1.2.3/apple-eloquence-elf-1.2.3-linux-x86_64.tar.gz"
          tar -xzf aee.tar.gz
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          sed -i 's|/usr/lib/eloquence|'"$PWD"'/lib|g' eci.ini
          cc -O0 -g -rdynamic -o /tmp/dump_engine "$GITHUB_WORKSPACE/oracle/dump_engine.c" -ldl

      - name: Generate corpora
        run: python3 "$GITHUB_WORKSPACE/oracle/make_corpus.py"

      - name: Probe zh-CN under gdb (diagnostic
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          echo "--- eci.ini ---"
          head -8 eci.ini
          echo "--- gdb probe ---"
          taskset -c 0 gdb -q -batch -ex run --args /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tee /tmp/probe.tsv; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN probe partial rc=${PIPESTATUS[0]}"; fi
          head -14 /tmp/probe.tsv

      - name: Encoding matrix (which text encoding feeds chs pinyin
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          unset DUMP_WANT_PHONEME
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt"
          iconv -f UTF-8 -t GB18030 -c "$s" > /tmp/in_gb.txt
          iconv -f UTF-8 -t UTF-16LE "$s" > /tmp/in_u16.txt
          for enc in GB18030 UTF-8 UTF-16LE; do
            case $enc in
              GB18030) f=/tmp/in_gb.txt;;
              UTF-8) f=$s;;
              UTF-16LE) f=/tmp/in_u16.txt;;
            esac
            echo "--- ENC=$enc ---"
            /tmp/dump_engine 0x60000 < "$f" | awk -F'\t' '
              /pcm/{c[$2]++}
              /pinyins/{if (substr($3,1,80) ~ /[1-9]/) nz++; else z++}
              END{
                printf "pcm: "; for (k in c) printf "%s=%d ",k,c[k]; printf "\n";
                printf "pinyin-mask nonzero=%d allzero=%d\n",nz+0,z+0
              }'
          done
          echo "(empty pcm histogram == no pcm lines; pinyin allzero == text never parsed to pinyin)"

      - name: Dump zh-CN (dialect 0x60000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          # UTF-8 control (current behavior)
          taskset -c 0 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.tsv" 2>/tmp/zh-cn-utf8.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-cn-sample partial rc=${PIPESTATUS[0]}"; fi
          # GB18030 (IBM dialect default: eciMandarinChinese = GB2312)
          iconv -f UTF-8 -t GB18030 -c "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" > /tmp/zh-cn-gb.txt
          taskset -c 0 /tmp/dump_engine 0x60000 < /tmp/zh-cn-gb.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample-gb.tsv" 2>/tmp/zh-cn-gb.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-cn-sample-gb partial rc=${PIPESTATUS[0]}"; fi
          iconv -f UTF-8 -t GB18030 -c "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" > /tmp/hanzi-gb.txt 2>/dev/null || true
          wc -l /tmp/hanzi-gb.txt
          taskset -c 0 /tmp/dump_engine 0x60000 < /tmp/hanzi-gb.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-hanzi.tsv"; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-cn-hanzi partial rc=${PIPESTATUS[0]}"; fi
          echo "--- utf8 rc trace ---"; head -4 /tmp/zh-cn-utf8.err
          echo "--- gb rc trace ---"; head -4 /tmp/zh-cn-gb.err
          echo "--- zh-cn utf8 rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.tsv" || true
          echo "--- zh-cn gb rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample-gb.tsv" || true

      - name: Dump zh-TW (dialect 0x60001
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          # UTF-8 control
          taskset -c 0 /tmp/dump_engine 0x60001 < "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.tsv" 2>/tmp/zh-tw-utf8.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-tw-sample partial rc=${PIPESTATUS[0]}"; fi
          # Big5 (eciTaiwaneseMandarin
          iconv -f UTF-8 -t BIG5 -c "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.txt" > /tmp/zh-tw-big5.txt
          taskset -c 0 /tmp/dump_engine 0x60001 < /tmp/zh-tw-big5.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample-big5.tsv" 2>/tmp/zh-tw-big5.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-tw-sample-big5 partial rc=${PIPESTATUS[0]}"; fi
          iconv -f UTF-8 -t BIG5 -c "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" > /tmp/hanzi-big5.txt 2>/dev/null || true
          taskset -c 0 /tmp/dump_engine 0x60001 < /tmp/hanzi-big5.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-hanzi.tsv"; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN zh-tw-hanzi partial rc=${PIPESTATUS[0]}"; fi
          echo "--- zh-tw utf8 rc ---"; head -3 /tmp/zh-tw-utf8.err
          echo "--- zh-tw big5 rc ---"; head -3 /tmp/zh-tw-big5.err
          echo "--- zh-tw utf8 pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.tsv" | head -3
          echo "--- zh-tw big5 pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample-big5.tsv" | head -3

      - name: Dump ko (dialect 0xA0000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          # UTF-8 control
          taskset -c 0 /tmp/dump_engine 0xA0000 < "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.tsv" 2>/tmp/ko-utf8.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN ko-sample partial rc=${PIPESTATUS[0]}"; fi
          # UHC (eciKorean = UHC fallback
          iconv -f UTF-8 -t UHC -c "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.txt" > /tmp/ko-uhc.txt
          taskset -c 0 /tmp/dump_engine 0xA0000 < /tmp/ko-uhc.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/ko-sample-uhc.tsv" 2>/tmp/ko-uhc.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN ko-sample-uhc partial rc=${PIPESTATUS[0]}"; fi
          echo "--- ko utf8 rc ---"; head -3 /tmp/ko-utf8.err
          echo "--- ko uhc rc ---"; head -3 /tmp/ko-uhc.err
          echo "--- ko utf8 pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.tsv" | head -3
          echo "--- ko uhc pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ko-sample-uhc.tsv" | head -3

      - name: Dump ja (dialect 0x80000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          # UTF-8 control
          taskset -c 0 /tmp/dump_engine 0x80000 < "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.tsv" 2>/tmp/ja-utf8.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN ja-sample partial rc=${PIPESTATUS[0]}"; fi
          # EUC-JP (eciStandardJapanese = SJIS; try Shift_JIS first
          iconv -f UTF-8 -t SHIFT_JIS -c "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.txt" > /tmp/ja-sjis.txt
          taskset -c 0 /tmp/dump_engine 0x80000 < /tmp/ja-sjis.txt | tee "$GITHUB_WORKSPACE/oracle/corpus/ja-sample-sjis.tsv" 2>/tmp/ja-sjis.err; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN ja-sample-sjis partial rc=${PIPESTATUS[0]}"; fi
          echo "--- ja utf8 rc ---"; head -3 /tmp/ja-utf8.err
          echo "--- ja sjis rc ---"; head -3 /tmp/ja-sjis.err
          echo "--- ja utf8 pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.tsv" | head -3
          echo "--- ja sjis pcm ---"; grep '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ja-sample-sjis.tsv" | head -3

      - name: Validate oracle output
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/oracle/corpus"
          ok=0
          for f in zh-cn-sample.tsv zh-cn-sample-gb.tsv zh-cn-hanzi.tsv zh-tw-sample.tsv zh-tw-sample-big5.tsv zh-tw-hanzi.tsv ko-sample.tsv ko-sample-uhc.tsv ja-sample.tsv ja-sample-sjis.tsv; do
            if [ -f "$f" ]; then
              pcm=$(grep -c '^pcm' "$f" || true)
              nonzero=$(awk -F'\t' '/^pcm/{if ($2 > 0) n++} END{print n+0}' "$f")
              echo "$f: pcm_rows=$pcm nonzero=$nonzero"
              if [ "$nonzero" -gt 0 ]; then ok=1; fi
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "FATAL: no dialect produced waveform output (all zero)"
            exit 1
          fi
          echo "VALIDATE-OK: at least one encoding produced audio"

      - name: Upload oracle dumps
        uses: actions/upload-artifact@v4
        with:
          name: oracle-dumps
          path: "oracle/corpus/*.tsv"
          if-no-files-found: warn