name: oracle-dump

on:
  workflow_dispatch:
  push:
    branches: [oracle-dev]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev gdb

      - name: Fetch converted engine (oracle, dev-only
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o aee.tar.gz "https://github.com/Mudb0y/Apple-Eloquence-ELF/releases/download/1.2.3/apple-eloquence-elf-1.2.3-linux-aarch64.tar.gz"
          tar -xzf aee.tar.gz
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          cc -O0 -g -rdynamic -o /tmp/dump_engine "$GITHUB_WORKSPACE/oracle/dump_engine.c" -ldl
          cc -O0 -o /tmp/probe2 "$GITHUB_WORKSPACE/oracle/probe2.c" -ldl

      - name: Prep oracle workdirs (gate layout, minimal ini + per-dialect libs)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          mkdir -p work_en work_zh_cn work_zh_tw work_ko work_ja
          cp lib/eci.so lib/enu.so work_en/
          cp lib/eci.so lib/chs.so lib/chsrom.so work_zh_cn/
          cp lib/eci.so lib/cht.so lib/chtrom.so work_zh_tw/
          cp lib/eci.so lib/kor.so lib/korrom.so work_ko/
          cp lib/eci.so lib/jpn.so lib/jpnrom.so work_ja/
          printf '[1.0]\nPath=./enu.so\nVersion=6.1\n' > work_en/eci.ini
          printf '[6.0]\nPath=./chs.so\nPath_Rom=./chsrom.so\nVersion=6.1\n' > work_zh_cn/eci.ini
          printf '[6.1]\nPath=./cht.so\nPath_Rom=./chtrom.so\nVersion=6.1\n' > work_zh_tw/eci.ini
          printf '[10.0]\nPath=./kor.so\nPath_Rom=./korrom.so\nVersion=6.1\n' > work_ko/eci.ini
          printf '[8.0]\nPath=./jpn.so\nPath_Rom=./jpnrom.so\nVersion=6.1\n' > work_ja/eci.ini
          echo prep-ok; ls work_zh_cn

      - name: Isolate probe2 vs dump_engine (same layout, one CI run
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          printf 'Hello, world.\nThis is a test sentence.\n' > /tmp/en2.txt
          echo "--- probe2 newEx en (gate-proven binary, this layout) ---"
          /tmp/probe2 work_en newEx 0x10000 < /tmp/en2.txt 2>&1 | tail -2
          echo "--- probe2 newEx zh-CN ---"
          /tmp/probe2 work_zh_cn newEx 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tail -2
          echo "--- dump ONESHOT en ---"
          DUMP_WORKDIR="$PWD/work_en" DUMP_ONESHOT=1 DUMP_TRACE=1 /tmp/dump_engine 0x10000 < /tmp/en2.txt 2>&1 | tail -2
          echo "--- dump ONESHOT zh-CN ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 DUMP_TRACE=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tail -2
          echo "--- dump ONESHOT+pinyins zh-CN ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 DUMP_PINYIN=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | grep -E 'pinyins|pcm' | head -4
          echo "--- dump ONESHOT+phonemes zh-CN ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 DUMP_WANT_PHONEME=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | grep -E 'pcm|phone' | head -4
          echo "--- dump ONESHOT+both zh-CN ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 DUMP_PINYIN=1 DUMP_WANT_PHONEME=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | grep -E 'pinyins|pcm|phone' | head -5
          echo "--- dump ONESHOT+pinyins NOSYNTH zh-CN ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 DUMP_PINYIN=1 DUMP_NOSYNTH=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | grep -E 'pinyins|pcm' | head -3
          echo "--- dump per-line zh-CN (current) ---"
          DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_TRACE=1 /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tail -4

      - name: Generate corpora
        run: python3 "$GITHUB_WORKSPACE/oracle/make_corpus.py"

      - name: Probe zh-CN under gdb (diagnostic
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          export DUMP_WORKDIR="$PWD/work_zh_cn"
          echo "--- eci.ini ---"
          head -8 eci.ini
          echo "--- gdb probe ---"
          taskset -c 0 gdb -q -batch -ex run --args /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tee /tmp/probe.tsv; if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "WARN probe partial rc=${PIPESTATUS[0]}"; fi
          head -14 /tmp/probe.tsv

      - name: Encoding matrix (which text encoding feeds chs pinyin
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_GENPHON=1
          export DUMP_PINYIN=1
          export DUMP_TRACE=1
          export DUMP_WORKDIR="$PWD/work_zh_cn"
          unset DUMP_WANT_PHONEME
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt"
          iconv -f UTF-8 -t GB18030 -c "$s" > /tmp/in_gb.txt
          iconv -f UTF-8 -t UTF-16LE "$s" > /tmp/in_u16.txt
          for enc in GB18030 UTF-8 UTF-16LE; do
            case $enc in
              GB18030) f=/tmp/in_gb.txt;;
              UTF-8) f=$s;;
              UTF-16LE) f=/tmp/in_u16.txt;;
            esac
            echo "--- ENC=$enc ---"
            DUMP_WORKDIR="$PWD/work_zh_cn" DUMP_ONESHOT=1 /tmp/dump_engine 0x60000 < "$f" | awk -F'\t' '
              /pcm/{c[$2]++}
              /pinyins/{if (substr($3,1,80) ~ /[1-9]/) nz++; else z++}
              END{
                printf "pcm: "; for (k in c) printf "%s=%d ",k,c[k]; printf "\n";
                printf "pinyin-mask nonzero=%d allzero=%d\n",nz+0,z+0
              }'
          done
          echo "--- high-level speak paths (GB18030, 4 rows) ---"
          for mode in speak addtext2; do
            echo "[mode=$mode]"
            DUMP_MODE=$mode DUMP_WORKDIR="$PWD/work_zh_cn" /tmp/dump_engine 0x60000 < /tmp/in_gb.txt | grep -E '^speak|^addtext2' || echo "no rows"
          done
          echo "--- ENGLISH CONTROL (dialect 0x10000, enu.so) ---"
          printf 'Hello, world.\nThis is a test sentence.\n' > /tmp/en2.txt
          DUMP_WORKDIR="$PWD/work_en" DUMP_ONESHOT=1 /tmp/dump_engine 0x10000 < /tmp/en2.txt | awk -F'\t' '/pcm/{c[$2]++; if ($2>0) nz++} END{printf "pcm: "; for (k in c) printf "%s=%d ",k,c[k]; printf "\nnonzero=%d\n", nz+0}'
          echo "--- ENGLISH CONTROL via speak (eciSpeakTextEx) ---"
          DUMP_MODE=speak DUMP_WORKDIR="$PWD/work_en" /tmp/dump_engine 0x10000 < /tmp/en2.txt | grep -E '^speak' || true
          en_nz=$(DUMP_WORKDIR="$PWD/work_en" DUMP_ONESHOT=1 /tmp/dump_engine 0x10000 < /tmp/en2.txt | awk -F'\t' '/pcm/{if ($2>0) nz++} END{print nz+0}')
          if [ "$en_nz" = "0" ]; then
            echo "FATAL: engine renders no audio even for English on this host"
            exit 1
          fi
          echo "(empty pcm histogram == no pcm lines; pinyin allzero == text never parsed to pinyin)"

      - name: Dump zh-CN (dialect 0x60000)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WORKDIR="$PWD/work_zh_cn"
          export DUMP_ONESHOT=1
          export DUMP_WANT_PHONEME=1
          unset DUMP_PINYIN DUMP_TRACE DUMP_GENPHON
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt"
          echo "--- zh-cn sample UTF-8 (one row per line, one-shot) ---"
          : > /tmp/z1.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | taskset -c 0 /tmp/dump_engine 0x60000 >> /tmp/z1.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/z1.tsv
          done < "$s"
          cp /tmp/z1.tsv "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.tsv"
          echo "--- zh-cn sample GB18030 ---"
          : > /tmp/z2.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | iconv -f UTF-8 -t GB18030 -c | taskset -c 0 /tmp/dump_engine 0x60000 >> /tmp/z2.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/z2.tsv
          done < "$s"
          cp /tmp/z2.tsv "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample-gb.tsv"
          echo "--- zh-cn FULL hanzi sweep (GB18030) ---"
          iconv -f UTF-8 -t GB18030 -c "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" > /tmp/hanzi-gb.txt 2>/dev/null || true
          wc -l < /tmp/hanzi-gb.txt
          : > "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-hanzi.tsv"
          NPROC=$(nproc); [ "$NPROC" -gt 4 ] && NPROC=4
          split -n "l/$NPROC" -d -a2 /tmp/hanzi-gb.txt /tmp/hz_
          for f in /tmp/hz_[0-9][0-9]; do
            ( while IFS= read -r line; do
                printf '%s\n' "$line" | /tmp/dump_engine 0x60000 >> "$f.tsv"
                printf 'nl\t%s\n' "$line" >> "$f.tsv"
              done < "$f" ) &
          done
          wait
          for f in /tmp/hz_[0-9][0-9]; do cat "$f.tsv"; done >> "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-hanzi.tsv"
          echo "--- zh-cn sample rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.tsv" || true
          echo "--- zh-cn hanzi rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-hanzi.tsv" || true

      - name: Dump zh-TW (dialect 0x60001)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WORKDIR="$PWD/work_zh_tw"
          export DUMP_ONESHOT=1
          export DUMP_WANT_PHONEME=1
          unset DUMP_PINYIN DUMP_TRACE DUMP_GENPHON
          s="$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.txt"
          echo "--- zh-tw sample UTF-8 ---"
          : > /tmp/t1.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | taskset -c 0 /tmp/dump_engine 0x60001 >> /tmp/t1.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/t1.tsv
          done < "$s"
          cp /tmp/t1.tsv "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.tsv"
          echo "--- zh-tw sample BIG5 ---"
          : > /tmp/t2.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | iconv -f UTF-8 -t BIG5 -c | taskset -c 0 /tmp/dump_engine 0x60001 >> /tmp/t2.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/t2.tsv
          done < "$s"
          cp /tmp/t2.tsv "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample-big5.tsv"
          echo "--- zh-tw FULL hanzi sweep (BIG5) ---"
          iconv -f UTF-8 -t BIG5 -c "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" > /tmp/hanzi-big5.txt 2>/dev/null || true
          wc -l < /tmp/hanzi-big5.txt
          : > "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-hanzi.tsv"
          NPROC=$(nproc); [ "$NPROC" -gt 4 ] && NPROC=4
          split -n "l/$NPROC" -d -a2 /tmp/hanzi-big5.txt /tmp/ht_
          for f in /tmp/ht_[0-9][0-9]; do
            ( while IFS= read -r line; do
                printf '%s\n' "$line" | /tmp/dump_engine 0x60001 >> "$f.tsv"
                printf 'nl\t%s\n' "$line" >> "$f.tsv"
              done < "$f" ) &
          done
          wait
          for f in /tmp/ht_[0-9][0-9]; do cat "$f.tsv"; done >> "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-hanzi.tsv"
          echo "--- zh-tw sample rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.tsv" || true

      - name: Dump ko (dialect 0xA0000)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WORKDIR="$PWD/work_ko"
          export DUMP_ONESHOT=1
          export DUMP_WANT_PHONEME=1
          unset DUMP_PINYIN DUMP_TRACE DUMP_GENPHON
          s="$GITHUB_WORKSPACE/oracle/corpus/ko-sample.txt"
          echo "--- ko sample UTF-8 ---"
          : > /tmp/k1.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | taskset -c 0 /tmp/dump_engine 0xA0000 >> /tmp/k1.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/k1.tsv
          done < "$s"
          cp /tmp/k1.tsv "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.tsv"
          echo "--- ko sample UHC ---"
          : > /tmp/k2.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | iconv -f UTF-8 -t UHC -c | taskset -c 0 /tmp/dump_engine 0xA0000 >> /tmp/k2.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/k2.tsv
          done < "$s"
          cp /tmp/k2.tsv "$GITHUB_WORKSPACE/oracle/corpus/ko-sample-uhc.tsv"
          echo "--- ko sample rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.tsv" || true

      - name: Dump ja (dialect 0x80000)
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-aarch64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WORKDIR="$PWD/work_ja"
          export DUMP_ONESHOT=1
          export DUMP_WANT_PHONEME=1
          unset DUMP_PINYIN DUMP_TRACE DUMP_GENPHON
          s="$GITHUB_WORKSPACE/oracle/corpus/ja-sample.txt"
          echo "--- ja sample UTF-8 ---"
          : > /tmp/j1.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | taskset -c 0 /tmp/dump_engine 0x80000 >> /tmp/j1.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/j1.tsv
          done < "$s"
          cp /tmp/j1.tsv "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.tsv"
          echo "--- ja sample SHIFT_JIS ---"
          : > /tmp/j2.tsv
          while IFS= read -r line; do
            printf '%s\n' "$line" | iconv -f UTF-8 -t SHIFT_JIS -c | taskset -c 0 /tmp/dump_engine 0x80000 >> /tmp/j2.tsv
            printf 'nl\t%s\n' "$line" >> /tmp/j2.tsv
          done < "$s"
          cp /tmp/j2.tsv "$GITHUB_WORKSPACE/oracle/corpus/ja-sample-sjis.tsv"
          echo "--- ja sample rows ---"; grep -c '^pcm' "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.tsv" || true


      - name: Validate oracle output
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/oracle/corpus"
          ok=0
          for f in zh-cn-sample.tsv zh-cn-sample-gb.tsv zh-cn-hanzi.tsv zh-tw-sample.tsv zh-tw-sample-big5.tsv zh-tw-hanzi.tsv ko-sample.tsv ko-sample-uhc.tsv ja-sample.tsv ja-sample-sjis.tsv; do
            if [ -f "$f" ]; then
              pcm=$(grep -c '^pcm' "$f" || true)
              nonzero=$(awk -F'\t' '/^pcm/{if ($2 > 0) n++} END{print n+0}' "$f")
              echo "$f: pcm_rows=$pcm nonzero=$nonzero"
              if [ "$nonzero" -gt 0 ]; then ok=1; fi
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "FATAL: no dialect produced waveform output (all zero)"
            exit 1
          fi
          echo "VALIDATE-OK: at least one encoding produced audio"

      - name: Upload oracle dumps
        uses: actions/upload-artifact@v4
        with:
          name: oracle-dumps
          path: "oracle/corpus/*.tsv"
          if-no-files-found: warn