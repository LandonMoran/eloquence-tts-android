name: oracle-dump

on:
  workflow_dispatch:
  push:
    branches: [oracle-dev]

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: LandonMoran/eloquence-tts-android
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install runtime libs
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev gdb

      - name: Fetch converted engine (oracle, dev-only
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sL -o aee.tar.gz "https://github.com/Mudb0y/Apple-Eloquence-ELF/releases/download/1.2.3/apple-eloquence-elf-1.2.3-linux-x86_64.tar.gz"
          tar -xzf aee.tar.gz
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          sed -i 's|/usr/lib/eloquence|'"$PWD"'/lib|g' eci.ini
          cc -O0 -g -rdynamic -o /tmp/dump_engine "$GITHUB_WORKSPACE/oracle/dump_engine.c" -ldl

      - name: Generate corpora
        run: python3 "$GITHUB_WORKSPACE/oracle/make_corpus.py"

      - name: Probe zh-CN under gdb (diagnostic
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WANT_PHONEME=1
          export DUMP_GENPHON=1
          pwd
          echo "--- eci.ini ---"
          head -8 eci.ini
          echo "--- phoneme extract ---"
          /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" 2>&1 | tee /tmp/probe.tsv; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN probe rc=$rc partial"; sed -n '1,25p' /tmp/probe.tsv

      - name: Dump zh-CN (dialect 0x60000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WANT_PHONEME=1
          export DUMP_GENPHON=1
          /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-sample.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN zh-cn-sample rc=$rc partial"
          /tmp/dump_engine 0x60000 < "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-cn-hanzi.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN zh-cn-hanzi rc=$rc partial"

      - name: Dump zh-TW (dialect 0x60001
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WANT_PHONEME=1
          export DUMP_GENPHON=1
          /tmp/dump_engine 0x60001 < "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-sample.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN zh-tw-sample rc=$rc partial"
          /tmp/dump_engine 0x60001 < "$GITHUB_WORKSPACE/oracle/corpus/hanzi-sweep.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/zh-tw-hanzi.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN zh-tw-hanzi rc=$rc partial"

      - name: Dump ko (dialect 0xA0000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WANT_PHONEME=1
          export DUMP_GENPHON=1
          /tmp/dump_engine 0xA0000 < "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/ko-sample.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN ko-sample rc=$rc partial"

      - name: Dump ja (dialect 0x80000
        run: |
          set -o pipefail
          cd apple-eloquence-elf-1.2.3-linux-x86_64
          export LD_LIBRARY_PATH="$PWD/lib"
          export DUMP_WANT_PHONEME=1
          export DUMP_GENPHON=1
          /tmp/dump_engine 0x80000 < "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.txt" | tee "$GITHUB_WORKSPACE/oracle/corpus/ja-sample.tsv"; rc=${PIPESTATUS[0]}; [ $rc -ne 0 ] && echo "WARN ja-sample rc=$rc partial"

      - name: Upload oracle dumps
        uses: actions/upload-artifact@v4
        with:
          name: oracle-dumps
          path: "oracle/corpus/*.tsv"
          if-no-files-found: warn